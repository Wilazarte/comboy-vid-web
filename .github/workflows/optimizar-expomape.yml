name: Optimizar multimedia EXPOMAPE
# Descarga las fotos y videos que se subieron por cPanel a /expomape/img/,
# los comprime para web (fotos < 150 KB en WEBP, videos 720p) y los guarda en expomape/img/web/.
on:
  push:
    paths: ['.github/workflows/optimizar-expomape.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp ffmpeg >/dev/null
      - name: Descargar y comprimir
        run: |
          set -e
          BASE=https://comboyvid.com/expomape/img
          mkdir -p orig expomape/img/web
          for f in principal.jpg general1.jpg stand2.jpg stand3.jpg cliente1.jpg cliente2.jpg cliente3.jpg IMG-20261016-WA0205.jpg cochemin.jpg; do
            curl -fsSL --retry 3 "$BASE/$f" -o "orig/$f" || { echo "no se pudo bajar $f"; continue; }
            n="${f%.*}"; n=$(echo "$n" | tr 'A-Z' 'a-z')
            convert "orig/$f" -auto-orient -strip -resize '1600x1600>' "orig/$n.png"
            q=82
            while :; do
              cwebp -quiet -q $q -m 6 "orig/$n.png" -o "expomape/img/web/$n.webp"
              s=$(stat -c%s "expomape/img/web/$n.webp")
              [ "$s" -le 150000 ] || [ $q -le 40 ] && break
              q=$((q-6))
            done
            if [ "$(stat -c%s expomape/img/web/$n.webp)" -gt 150000 ]; then
              convert "orig/$n.png" -resize '1200x1200>' "orig/$n.png"; cwebp -quiet -q 60 -m 6 "orig/$n.png" -o "expomape/img/web/$n.webp"
            fi
            echo "$n.webp $(stat -c%s expomape/img/web/$n.webp) bytes (q=$q) $(identify -format '%wx%h' expomape/img/web/$n.webp)"
          done
          for f in video1.mp4 principal2.mp4 expo1.mp4 prueba1.mp4; do
            curl -fsSL --retry 3 "$BASE/$f" -o "orig/$f" || { echo "no se pudo bajar $f"; continue; }
            n="${f%.*}"
            ffprobe -v error -show_entries stream=width,height,duration,codec_name -of csv=p=0 "orig/$f" || true
            ffmpeg -loglevel error -y -i "orig/$f" -vf "scale='min(1280,iw)':-2" -c:v libx264 -preset slow -crf 27 -c:a aac -b:a 96k -movflags +faststart "expomape/img/web/$n.mp4"
            ffmpeg -loglevel error -y -ss 1 -i "orig/$f" -frames:v 1 -vf "scale='min(1280,iw)':-2" "orig/$n-poster.png"
            cwebp -quiet -q 72 "orig/$n-poster.png" -o "expomape/img/web/$n-poster.webp"
            echo "$n.mp4 $(stat -c%s expomape/img/web/$n.mp4) bytes"
          done
          ls -la expomape/img/web
      - name: Guardar en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expomape/img/web
          git commit -m "expomape: multimedia optimizada para web (fotos WEBP < 150 KB, videos 720p)" || echo "sin cambios"
          git push
