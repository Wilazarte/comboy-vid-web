name: Prueba postular (temporal)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/test-postular.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POST real
        run: |
          U=https://www.comboyvid.com/convocatorias/postular.php
          echo skip; true || curl -sS -i -A "Mozilla/5.0 (Linux; Android 14) Mobile" $U -F empresa_web=x -F puesto=x | head -20
          true || curl -sS -i -A "Mozilla/5.0 (Linux; Android 14) Mobile" $U -F puesto="Asistente Administrativo(a)" -F nombres="PRUEBA SISTEMA" -F dni=12345678 -F celular=987654321 -F acepta=si | head -20
          cp convocatorias/docs/convocatoria-asistente-administrativo.pdf "/tmp/CV PRUEBA.pdf"; head -c 4500000 /dev/urandom >> "/tmp/CV PRUEBA.pdf"; ls -la /tmp/*.pdf
          echo "== con PDF =="; curl -sS -i -A "Mozilla/5.0 (Linux; Android 14) Mobile" -H "Origin: https://www.comboyvid.com" -H "Referer: https://www.comboyvid.com/convocatorias/" $U -F puesto="Asistente Administrativo(a)" -F "nombres=PRUEBA SISTEMA 4MB (ignorar)" -F dni=12345678 -F celular="987 654 321" -F correo= -F ciudad= -F formacion= -F experiencia= -F disponibilidad= -F mensaje= -F empresa_web= -F acepta=si -F "cv=@/tmp/CV PRUEBA.pdf;type=application/pdf" | head -30
