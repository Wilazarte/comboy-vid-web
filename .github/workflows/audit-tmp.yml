name: Auditoria pasiva (temporal)
on:
  push:
    branches: [audit-tmp-seguridad]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probar si el FTP acepta conexion cifrada (FTPS), sin listar ni subir nada
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get -qq install -y lftp >/dev/null 2>&1
          for v in yes no; do
            if timeout 40 lftp -u "$U","$P" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate $v; set net:max-retries 1; set net:timeout 15; pwd; bye" "ftp://$S" >/dev/null 2>/tmp/e; then echo "FTPS OK (verificar certificado=$v)"; else echo "FTPS FALLA (verificar certificado=$v): $(head -c 200 /tmp/e)"; fi
          done
          echo | timeout 15 openssl s_client -starttls ftp -connect "$S:21" 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>/dev/null || echo "sin certificado STARTTLS"
